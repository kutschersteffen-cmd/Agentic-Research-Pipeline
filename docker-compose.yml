# Two things live in this file:
#
# 1. The app itself (`backend`, `frontend`) -- Corporate Readiness Plan,
#    Phase 1 (see docs/CORPORATE_READINESS_PLAN.md). An additive local-dev
#    path: `docker compose up backend frontend --build` gets a new machine
#    to a working stack without the multi-step README setup. The venv/npm
#    workflow in README "Setup" is unaffected and keeps working the same
#    way. Backend secrets/config still come from backend/.env (see
#    backend/.env.example) -- copy and fill it in before starting, same as
#    the non-Docker setup.
#
# 2. Local development infrastructure for the opt-in Postgres/pgvector,
#    OpenSearch, and object-storage backends (backend/arp/storage/postgres*.py,
#    opensearch_client.py, object_store_client.py). None of these are
#    required to run this project -- every store is file-based by default
#    (see backend/arp/config.py). Point the `backend` service's .env at
#    them (ARP_POSTGRES_DSN=postgresql+psycopg://arp:arp@postgres:5432/arp,
#    ARP_OPENSEARCH_URL=http://opensearch:9200, etc.) to actually use them
#    from the containerized app, or at localhost equivalents to use them
#    from a venv-based `uvicorn --reload` run instead.
#
# Usage:
#   docker compose up --build                        # everything
#   docker compose up backend frontend --build        # just the app
#   docker compose up -d postgres opensearch minio     # just the dev infra
#   Then:  arp db init-postgres && arp db init-opensearch && arp db init-object-store
#   docker compose --env-file backend/.env up -d postgres superset   # BI (arp/bi/), then:
#          arp db init-postgres && arp bi bootstrap

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Bound to 127.0.0.1 only -- keep it that way. The app runs in dev sign-in
    # mode (README "Sign-in"): there is no token, and every request from
    # loopback or ARP_DEV_TRUSTED_NETWORKS is signed in as the dev approver.
    # The browser's requests reach this container from the Docker bridge
    # (172.16.0.0/12), not loopback, hence the trusted range below. That is
    # only safe because the published port is loopback-bound: a bare
    # "8000:8000" publishes on 0.0.0.0, Docker would forward LAN traffic in
    # through the bridge too, and every host on the network would become an
    # approver. (Other containers on the compose network are trusted as well.)
    # Switching to real sign-in: create config/users.json, set
    # ARP_AUTH_MODE=local below and drop ARP_DEV_TRUSTED_NETWORKS. Tokens are
    # shared secrets over plain HTTP, so put TLS in front before widening ports.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env
    environment:  # overrides backend/.env
      ARP_AUTH_MODE: dev
      ARP_DEV_TRUSTED_NETWORKS: '["172.16.0.0/12"]'
      ARP_USERS_FILE: /app/config/users.json
      # The browser calls the API as localhost:8000 (VITE_API_BASE), which the
      # default ARP_TRUSTED_HOSTS allows; set ARP_TRUSTED_HOSTS (JSON list) if
      # you reach it under another host name. On Docker hosts whose compose
      # subnets come from 192.168.0.0/16, change the trusted range above to match.
    volumes:
      - arp_runs:/app/runs
      - arp_schemas:/app/schemas
      - arp_taxonomies:/app/taxonomies
      - arp_portfolios:/app/portfolios
      - arp_documents:/app/data/documents
      - arp_blobs:/app/data/blobs
      - arp_engagements:/app/engagements
      - arp_ballots:/app/ballots
      - arp_cache:/app/backend/.cache
      - arp_discovery_state:/app/backend/.discovery_state
      - arp_document_store:/app/backend/.document_store
      # Sign-in users for local mode (README "Sign-in"): config/users.json,
      # created from config/users.example.json. Not needed in dev mode. The
      # whole directory is mounted so a missing users.json is not turned into
      # an empty directory by Docker. Restart the backend after editing it.
      - ./config:/app/config:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    # Loopback too, for the same reason.
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    # Loopback-only, like the app containers above. These dev services ship
    # with fixed throwaway credentials (arp/arp here, arp/arp12345 for minio)
    # and OpenSearch runs with its security plugin off, so publishing them on
    # 0.0.0.0 hands anyone on the network an open database, search cluster and
    # object store. Reach them from the host as 127.0.0.1 exactly as before;
    # container-to-container traffic goes over the compose network and is
    # unaffected by this.
    environment:
      POSTGRES_USER: arp
      POSTGRES_PASSWORD: arp
      POSTGRES_DB: arp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arp"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      # Dev-only: disables auth/TLS so a local instance needs no
      # certs/admin password. Never set this on a real deployment.
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - arp_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: browse/query OpenSearch indices in a UI. Comment out if not needed.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arp
      MINIO_ROOT_PASSWORD: arp12345
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console
    volumes:
      - arp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Apache Superset for the BI designer (arp/bi/). Its metadata lives in a
  # separate `superset` database in the postgres service above (created on
  # boot if missing); ARP data is read through the `bi_reader` role that
  # `arp bi bootstrap` registers. Secrets (SUPERSET_SECRET_KEY,
  # SUPERSET_GUEST_TOKEN_JWT_SECRET, ARP_SUPERSET_PASSWORD) come from
  # backend/.env via `docker compose --env-file backend/.env ...` and have no
  # defaults. Loopback-only like everything here.
  superset:
    build: ./superset  # apache/superset:5.0.0 plus the Postgres driver
    image: arp-superset:5.0.0
    entrypoint: ["/app/pythonpath/entrypoint.sh"]
    # Only what Superset needs, interpolated from the shell or `--env-file
    # backend/.env` -- never the whole backend env (LLM keys, DSNs, ...).
    # `:-` rather than `:?`, so the other services still start without these;
    # superset_config.py/entrypoint.sh refuse empty or placeholder values.
    environment:
      SUPERSET_DATABASE_URI: postgresql+psycopg2://arp:arp@postgres:5432/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
      SUPERSET_GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_JWT_SECRET:-}
      ARP_SUPERSET_USER: ${ARP_SUPERSET_USER:-arp_designer}
      ARP_SUPERSET_PASSWORD: ${ARP_SUPERSET_PASSWORD:-}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./superset:/app/pythonpath:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  arp_runs:
  arp_schemas:
  arp_taxonomies:
  arp_portfolios:
  arp_documents:
  arp_blobs:
  arp_engagements:
  arp_ballots:
  arp_cache:
  arp_discovery_state:
  arp_document_store:
  arp_postgres_data:
  arp_opensearch_data:
  arp_minio_data:
