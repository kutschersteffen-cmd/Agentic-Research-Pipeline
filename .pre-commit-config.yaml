# Corporate Readiness Plan, Phase 0 (see docs/CORPORATE_READINESS_PLAN.md).
#
# Setup (one-time per clone):
#   pip install pre-commit   # or: pip install -e "backend[dev]"
#   pre-commit install
#
# After that, every commit is scanned for secrets before it's made. The
# same gitleaks check also runs in CI (.github/workflows/ci.yml) so a
# contributor who hasn't run `pre-commit install` locally is still caught.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Frontend design-system guardrails (docs/UI_DESIGN_IMPROVEMENT_PLAN.md,
  # phase 5). Needs `node` on PATH, which this repo already assumes. The
  # same check runs in CI, so a contributor without pre-commit installed is
  # still caught.
  - repo: local
    hooks:
      - id: frontend-design-system
        name: Frontend design-system check
        entry: node frontend/scripts/check-design-system.mjs
        language: system
        files: ^frontend/src/.*\.(css|tsx)$
        pass_filenames: false
