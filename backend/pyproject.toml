[project]
name = "arp"
version = "0.1.0"
description = "Agentic Research Pipeline: thematic investment universe screening and schema-driven data-point extraction from company disclosures."
requires-python = ">=3.11"
dependencies = [
    # Upper bounds cap at the next major version above what's currently
    # verified (installed + full test suite run) to prevent an unpinned
    # transitive upgrade from silently breaking the pipeline; lower bounds
    # are unchanged from the original stated minimums. Bump the upper bound
    # deliberately, verifying against the test suite, rather than removing it.
    "anthropic>=1.13,<2.0",
    "google-genai>=1.75,<2.0",  # gemini-* models (arp/llm/gemini_client.py)
    "langchain-core>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-retrievers-bm25>=0.5,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<7.0",
    "pypdf>=4.2,<7.0",
    # Exact: the cloud parser (arp/compute/) must report the same parser_version() as a local install.
    "docling==2.140.0",
    "docling-core==2.101.1",
    "docling-ibm-models==4.0.3",
    "docling-parse==7.22.3",
    "cryptography>=42.0,<51.0",
    "trafilatura==2.3.1",
    "python-multipart>=0.0.9,<1.0",
    "numpy>=1.26,<3.0",
    "openpyxl==3.1.5",
    "fastembed>=0.9,<1.0",
    "google-auth>=2.40,<3.0",  # ID tokens for the Cloud Run compute services
    # Presentation & Reporting Tool (arp/reporting/): deterministic pptx/
    # docx/pdf rendering of an LLM-drafted ReportPlan. matplotlib backs
    # chart types with no native pptx chart object (waterfall, heatmap)
    # and every chart in the docx path (it has no live chart object at
    # all); reportlab draws the PDFs of `arp compute` and the test fixtures.
    "python-pptx>=1.0,<2.0",
    "python-docx>=1.1,<2.0",
    "matplotlib>=3.8,<4.0",
    "reportlab>=4.0,<5.0",
    # HTML house deck (arp/reporting/html_render.py, browser.py): jinja2
    # templates, rendered to pdf/png and fit-measured in headless Chromium.
    # CI and dev install the browser with `python -m playwright install chromium`.
    "jinja2>=3.1,<4.0",
    "playwright>=1.45,<2.0",
    # Decision Studio rule graphs (arp/decision/rules.py): GoRules ZEN, MIT.
    # Pinned exactly, in lockstep with frontend/package.json's
    # @gorules/zen-engine-wasm32-wasi: the browser previews a rule with the
    # same engine build the server scores it with, so the two cannot drift.
    "zen-engine==2.0.2",
    # Postgres is the system of record (arp/db/): runs, companies, review.
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.3,<1.0",
    # Company graph (arp/company_graph.py): supply edges for theme exposure layers, in Neo4j.
    "neo4j>=5.28,<6.0",
    # Company site / report identification (arp/discovery/names.py, site checks):
    # fuzzy name match, legal-suffix stripping, host -> registrable domain.
    "rapidfuzz>=3.14,<4.0",
    "cleanco>=2.3,<3.0",
    "tldextract>=5.4,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "diff-cover>=10.0,<11.0",
    "ruff>=0.8,<1.0",
    "pre-commit>=3.7,<5.0",
]
# Opt-in least-squares constraint projection for index construction
# (arp/index/optimize.py). Without it, ConstraintSolver.method='least_squares'
# falls back to the deterministic waterfall and records why. cvxpy ships
# Clarabel, OSQP and SCS, which is every solver the projection can use --
# no commercial licence and no risk model is involved at this stage.
optimize = [
    "cvxpy>=1.5",
    # SCIP, via PySCIPopt, is the free mixed-integer backend -- needed only
    # by cardinality limits and an enforced minimum weight, which are
    # disjunctions rather than bounds. Apache-2.0 since SCIP 9.
    "pyscipopt>=5.0",
]
# Empty: Postgres is required now and its packages are in `dependencies`.
# Kept so existing `pip install -e ".[postgres,...]"` lines keep working.
postgres = []
# Opt-in OpenSearch client (arp/storage/opensearch_client.py): user-facing
# search plus an alternate BM25 retrieval backend for select_evidence.py.
# Not required for the file/BM25-in-memory default path -- see
# Settings.opensearch_url.
opensearch = [
    "opensearch-py>=2.6,<3.0",
]
# Opt-in S3-compatible object-storage client (arp/storage/object_store_client.py,
# document_blob_store.py): immutable copies of source documents (MinIO
# locally, any S3-compatible endpoint in production). Not required for the
# default local-directory document store -- see Settings.object_store_endpoint_url.
object_storage = [
    "boto3>=1.34,<2.0",
]
# Emerging Themes Scanner (arp/emerging_themes/): embedding-based
# clustering with lineage tracking across an entire investment universe's
# public-source mention flow. Kept opt-in, same reasoning as `postgres`
# above -- these are heavier ML deps (umap-learn/hdbscan pull in numba/
# pynndescent/scikit-learn transitively) that the rest of this codebase
# deliberately avoids for its default, always-on retrieval path.
# scikit-learn also backs c-TF-IDF cluster labeling now and Isolation
# Forest anomaly scoring in the Phase 2 hardening pass; networkx backs
# Phase 2's Louvain co-mention community detection -- declared here now
# so Phase 2 doesn't need a second dependency change.
emerging_themes = [
    "umap-learn>=0.5,<1.0",
    "hdbscan>=0.8,<1.0",
    "scikit-learn>=1.4,<2.0",
    "networkx>=3.2,<4.0",
    "feedparser>=6.0,<7.0",
]
# Strategy Replication's free real-market PriceDataSource (arp/replication/
# price_data.py::YFinancePriceSource). Not required for the default,
# no-network CsvPriceSource -- see docs/STRATEGY_REPLICATION_METHODOLOGY.md.
replication = [
    "yfinance>=0.2,<1.0",
]
# Signal Lab topic attention (arp/signal_lab/methods/topics.py). Its UMAP,
# HDBSCAN and scikit-learn dependencies are the ones `emerging_themes` already uses.
topics = [
    "bertopic>=0.16,<1.0",
]
# Signal Lab FinBERT scoring (arp/signal_lab/methods/finbert.py). ProsusAI/finbert is
# CC BY-NC-SA 4.0: internal research only, nothing derived from it is sold or distributed.
finbert = [
    "transformers>=4.40,<6.0",
    "torch>=2.2,<3.0",
]
# Signal Lab notebook library (notebooks/signals/): open the percent-format .py files in JupyterLab.
notebooks = [
    "jupyterlab>=4,<5",
    "jupytext>=1.16,<2",
]

[project.scripts]
arp = "arp.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arp*"]

[tool.setuptools.package-data]
"arp.research.indirect_exposure" = ["sample_data/*.csv", "sample_data/*.md", "sample_data/*.json", "sample_data/*.npy", "reference/*.csv"]
"arp.golden_set" = ["data/*.json"]
"arp.emerging_themes" = ["reference/*.csv"]
"arp.normalise" = ["tables/*.csv", "tables/*.json"]
"arp.bi" = ["templates/*.json"]
"arp.holdings" = ["mappings/*.json"]
"arp.transition_barrier" = ["data/*.json"]
"arp.transition_alignment" = ["data/*.json"]
# These two were missing: their bundled data only resolves because CI and dev
# both use `pip install -e .`, so a non-editable wheel would drop it silently.
"arp.transition_plan" = ["data/*.json"]
"arp.replication" = ["data/*.json"]
"arp.presets" = ["data/*.json"]
"arp.decision" = ["data/*.json", "sample_data/*.csv"]
"arp.reporting" = ["style/*.json", "style/*.md", "style/templates/*.j2", "style/fonts/*/*.ttf", "style/fonts/*/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_superset: needs a running Superset (set ARP_TEST_SUPERSET_URL); skipped otherwise",
    "e2e: browser flow against the running app (scripts/e2e_stack.sh; set ARP_E2E_URL); skipped otherwise",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length -- long descriptive Field()/docstring prose is intentional throughout this codebase
    "B008",  # function-call-in-default-argument -- FastAPI's Depends()/Body() idiom, used throughout api/routers/
]

[tool.ruff.lint.isort]
known-first-party = ["arp"]
