[project]
name = "arp"
version = "0.1.0"
description = "Agentic Research Pipeline: thematic investment universe screening and schema-driven data-point extraction from company disclosures."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "llama-index-core>=0.12",
    "llama-index-retrievers-bm25>=0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
    "pymupdf4llm>=0.0.17",
    "cryptography>=42.0",
    "trafilatura>=1.9",
    "tenacity>=8.3",
    "APScheduler>=3.10",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "fastembed>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
# Opt-in relational/vector store (arp/storage/postgres*.py): portfolio
# holdings + an alternate pgvector embeddings-cache backend. Not required
# for the file-based default path -- see Settings.postgres_dsn.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

# Econometrics and figures for the corporate decarbonisation review
# (arp/decarb/research/*). The arp.decarb core is deliberately standard
# library only and needs none of this -- see backend/arp/decarb/README.md.
research = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.scripts]
arp = "arp.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arp*"]

[tool.setuptools.package-data]
"arp.research.indirect_exposure" = ["sample_data/*.csv", "sample_data/*.md"]
"arp.golden_set" = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
