[project]
name = "arp"
version = "0.1.0"
description = "Agentic Research Pipeline: thematic investment universe screening and schema-driven data-point extraction from company disclosures."
requires-python = ">=3.11"
dependencies = [
    # Upper bounds cap at the next major version above what's currently
    # verified (installed + full test suite run) to prevent an unpinned
    # transitive upgrade from silently breaking the pipeline; lower bounds
    # are unchanged from the original stated minimums. Bump the upper bound
    # deliberately, verifying against the test suite, rather than removing it.
    "anthropic>=0.40.0,<2.0",
    "langchain-core>=0.3,<2.0",
    "langchain-anthropic>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-retrievers-bm25>=0.5,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<7.0",
    "pypdf>=4.2,<7.0",
    "docling>=2.0,<3.0",
    "cryptography>=42.0,<51.0",
    "trafilatura>=1.9,<3.0",
    "tenacity>=8.3,<10.0",
    "APScheduler>=3.10,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "fastembed>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.8,<1.0",
]
# Opt-in relational/vector store (arp/storage/postgres*.py): portfolio
# holdings + an alternate pgvector embeddings-cache backend. Not required
# for the file-based default path -- see Settings.postgres_dsn.
postgres = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.3,<1.0",
]
# Emerging Themes Scanner (arp/emerging_themes/): embedding-based
# clustering with lineage tracking across an entire investment universe's
# public-source mention flow. Kept opt-in, same reasoning as `postgres`
# above -- these are heavier ML deps (umap-learn/hdbscan pull in numba/
# pynndescent/scikit-learn transitively) that the rest of this codebase
# deliberately avoids for its default, always-on retrieval path.
# scikit-learn also backs c-TF-IDF cluster labeling now and Isolation
# Forest anomaly scoring in the Phase 2 hardening pass; networkx backs
# Phase 2's Louvain co-mention community detection -- declared here now
# so Phase 2 doesn't need a second dependency change.
emerging_themes = [
    "umap-learn>=0.5,<1.0",
    "hdbscan>=0.8,<1.0",
    "scikit-learn>=1.4,<2.0",
    "networkx>=3.2,<4.0",
    "feedparser>=6.0,<7.0",
]

[project.scripts]
arp = "arp.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arp*"]

[tool.setuptools.package-data]
"arp.research.indirect_exposure" = ["sample_data/*.csv", "sample_data/*.md"]
"arp.golden_set" = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length -- long descriptive Field()/docstring prose is intentional throughout this codebase
    "B008",  # function-call-in-default-argument -- FastAPI's Depends()/Body() idiom, used throughout api/routers/
]

[tool.ruff.lint.isort]
known-first-party = ["arp"]
