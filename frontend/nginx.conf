# Static SPA serving for the built frontend (see frontend/Dockerfile).
# The frontend calls the backend directly from the browser via
# VITE_API_BASE (baked in at build time -- see README), so this config
# only needs to serve files and fall back to index.html for client-side
# routing; it does not proxy /api anywhere.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation, for the Decision Studio rule engine (threaded
    # WebAssembly needs SharedArrayBuffer). Repeated per location because
    # nginx drops server-level add_header in any block that sets its own.
    set $coop "same-origin";
    set $coep "require-corp";

    location / {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.wasm$ {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Long-cache hashed build assets; never cache index.html itself so a
    # new deploy is picked up on next load.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cache-Control "no-cache";
    }
}
