# Serves the built frontend (see frontend/Dockerfile) and forwards /api/ to the
# backend, so the page calls the API on its own origin.
#
# This file is an nginx template: the image copies it to
# /etc/nginx/templates/default.conf.template, and at container start nginx's
# entrypoint fills in ${ARP_BACKEND_URL} (env, default http://backend:8000),
# ${ARP_PUBLIC_HOSTS} (env, default "localhost 127.0.0.1"),
# ${ARP_SUPERSET_ORIGIN} (env, default http://127.0.0.1:8088, the Superset embed) and
# ${NGINX_LOCAL_RESOLVERS} (the nameservers in the container's /etc/resolv.conf),
# then writes /etc/nginx/conf.d/default.conf. NGINX_ENVSUBST_FILTER limits the
# substitution to those names, so nginx's own $variables are left alone.

# Host allow-list, against DNS rebinding. Every proxied request reaches the backend
# as Host: localhost from a trusted address, so in dev sign-in mode nginx is the only
# thing that can tell a rebound page (http://attacker.example:5173 resolving to this
# machine) from ARP itself. $host is the Host header without its port, lowercased;
# it is allowed when it is one of the space-separated names in ARP_PUBLIC_HOSTS
# (compared without regard to case). Anything else gets 421 on /api/.
map " ${ARP_PUBLIC_HOSTS} |$host" $arp_public_host {
    "~(?i) ([^ |]+) [^|]*\|\1$"  1;
    default                       "";
}

# For an allowed Host, the proxy rewrites Origin when it is the page's own origin:
# the backend's default ARP_ALLOWED_ORIGINS has http://localhost:5173, so dev sign-in
# works under every allowed name. A foreign Origin passes through unchanged and still
# gets no dev bypass; no Origin stays absent (an empty header value is not sent).
map "$arp_public_host|$http_origin|$scheme://$http_host" $arp_proxy_origin {
    "~^1\|(.+)\|\1$"  "http://localhost:5173";
    default            $http_origin;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation, for the Decision Studio rule engine (threaded
    # WebAssembly needs SharedArrayBuffer). Repeated per location because
    # nginx drops server-level add_header in any block that sets its own.
    set $coop "same-origin";
    set $coep "require-corp";
    # Security headers for every static answer, repeated per location like the two above.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'self' blob: ${ARP_SUPERSET_ORIGIN}; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;

    location / {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }

    # ^~ so the asset regexes below never catch an API path such as /api/…/chart.png.
    location ^~ /api/ {
        if ($arp_public_host = "") {
            return 421;
        }

        # Resolved per request (variable proxy_pass), so nginx starts and serves /
        # even when the backend host does not resolve yet; /api/ then answers 502.
        # Resolved through DNS only: /etc/hosts entries (--add-host, extra_hosts) and
        # search domains are not used, so give a name the resolver knows.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $arp_backend "${ARP_BACKEND_URL}";
        proxy_pass $arp_backend;

        # The backend's default ARP_TRUSTED_HOSTS accepts localhost wherever it runs.
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Origin $arp_proxy_origin;

        # Streamed answers arrive as produced; uploads go straight through, up to
        # 100 MB (413 above it).
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        gzip off;
        client_max_body_size 100m;
    }

    location ~* \.wasm$ {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Long-cache hashed build assets; never cache index.html itself so a
    # new deploy is picked up on next load.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        # The board diagram frame has an opaque origin, so its module scripts load cross-origin.
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache";
    }
}
