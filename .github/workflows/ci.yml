name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_SHARDS: 4  # must equal the length of backend-shard's matrix; a mismatch fails the check loudly

jobs:
  # The backend suite runs in BACKEND_SHARDS parts; `Backend (lint + tests)` (the required check)
  # passes only when every part passed and together they ran exactly the collected tests.
  # shortcut: the parts are balanced by backend_test_times.json (seconds per file, 15 Nov 2026); when
  # one shard runs much longer than the others, refresh it with `backend_shards.py --times`.
  backend-shard:
    name: Backend shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    # Postgres+pgvector and OpenSearch service containers so the opt-in,
    # real-instance integration suites (test_postgres_portfolio_store.py,
    # gated on ARP_TEST_POSTGRES_DSN; test_search_router.py's
    # test_search_against_a_real_opensearch_instance, gated on
    # ARP_TEST_OPENSEARCH_URL) actually run in CI instead of skipping --
    # every other test in the suite is DB/cluster-free by default and
    # unaffected by these containers being present.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/arp_neo4j_test
        ports:
          - 7688:7687  # the test graph's port, as in ensure-deps.sh and check.sh
        options: >-
          --health-cmd "cypher-shell -u neo4j -p arp_neo4j_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ARP_TEST_POSTGRES_DSN: postgresql+psycopg://arp:arp@localhost:5432/arp_test
      ARP_TEST_OPENSEARCH_URL: http://localhost:9200
      ARP_TEST_NEO4J_URI: bolt://localhost:7688
      ARP_TEST_NEO4J_PASSWORD: arp_neo4j_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares with the base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package (dev extras)
        run: pip install -e ".[dev,postgres,opensearch,emerging_themes,object_storage]"

      - name: Private NLTK data (nltk >= 3.10.4 refuses shared dirs)
        run: . "$GITHUB_WORKSPACE/.github/scripts/private_nltk_data.sh"

      - name: Playwright version
        id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Caches only the browser download; the system packages (--with-deps) still install.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium (HTML deck fit checks)
        run: python -m playwright install --with-deps chromium

      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9200/_cluster/health && exit 0
            sleep 2
          done
          echo "OpenSearch did not become ready in time" >&2
          exit 1

      - name: Ruff lint
        run: ruff check .

      - name: API contract snapshot up to date
        run: python scripts/export_openapi.py --check

      - name: Collect the whole suite
        run: |
          mkdir -p "$RUNNER_TEMP/backend-shard"
          pytest --collect-only -q > "$RUNNER_TEMP/backend-shard/collected.txt"

      - name: Pytest (part ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          COVERAGE_FILE: ${{ runner.temp }}/backend-shard/coverage
        run: >-
          pytest -q -p pytest_shard --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --shard-report="$RUNNER_TEMP/backend-shard/ran.txt" --cov=arp --cov-report=
          --shard-times="$GITHUB_WORKSPACE/.github/scripts/backend_test_times.json"

      - name: Hand the results to Backend (lint + tests)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-shard/
          retention-days: 3
          overwrite: true  # "Re-run failed jobs" uploads the same name again

  backend:
    name: Backend (lint + tests)
    if: always()  # never skipped: a skipped required check would count as passed
    needs: backend-shard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares with the base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest, coverage and diff-cover
        run: pip install "pytest>=8.2,<10.0" "coverage>=7.5,<8.0" "diff-cover>=10.0,<11.0"

      - name: Self-test the shard split and check
        run: |
          python ../.github/scripts/pytest_shard.py
          python ../.github/scripts/backend_shards.py --selftest

      - name: Download the shard results
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: ${{ runner.temp }}/shards

      - name: Every test ran exactly once
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/backend_shards.py "$BACKEND_SHARDS" "$RUNNER_TEMP/shards"

      - name: All shards passed
        if: ${{ !cancelled() }}
        run: |
          echo "backend shards: ${{ needs.backend-shard.result }}"
          test "${{ needs.backend-shard.result }}" = success

      - name: Combine coverage
        if: github.event_name == 'pull_request'
        run: |
          coverage combine "$RUNNER_TEMP"/shards/*/coverage
          coverage xml -o coverage.xml

      # Lines this PR adds or changes must be >= 80% covered; untouched code doesn't count.
      - name: Diff coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

