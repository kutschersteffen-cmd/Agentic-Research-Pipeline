name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres+pgvector and OpenSearch service containers so the opt-in,
    # real-instance integration suites (test_postgres_portfolio_store.py,
    # gated on ARP_TEST_POSTGRES_DSN; test_search_router.py's
    # test_search_against_a_real_opensearch_instance, gated on
    # ARP_TEST_OPENSEARCH_URL) actually run in CI instead of skipping --
    # every other test in the suite is DB/cluster-free by default and
    # unaffected by these containers being present.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/arp_neo4j_test
        ports:
          - 7688:7687  # the test graph's port, as in ensure-deps.sh and check.sh
        options: >-
          --health-cmd "cypher-shell -u neo4j -p arp_neo4j_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ARP_TEST_POSTGRES_DSN: postgresql+psycopg://arp:arp@localhost:5432/arp_test
      ARP_TEST_OPENSEARCH_URL: http://localhost:9200
      ARP_TEST_NEO4J_URI: bolt://localhost:7688
      ARP_TEST_NEO4J_PASSWORD: arp_neo4j_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares with the base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package (dev extras)
        run: pip install -e ".[dev,postgres,opensearch,emerging_themes,object_storage]"

      - name: Private NLTK data (nltk >= 3.10.4 refuses shared dirs)
        run: . "$GITHUB_WORKSPACE/.github/scripts/private_nltk_data.sh"

      - name: Install Chromium (HTML deck fit checks)
        run: python -m playwright install --with-deps chromium

      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9200/_cluster/health && exit 0
            sleep 2
          done
          echo "OpenSearch did not become ready in time" >&2
          exit 1

      - name: Ruff lint
        run: ruff check .

      - name: API contract snapshot up to date
        run: python scripts/export_openapi.py --check

      - name: Pytest
        run: pytest -q --cov=arp --cov-report=xml

      # Lines this PR adds or changes must be >= 80% covered; untouched code doesn't count.
      - name: Diff coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares with the base branch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # schema.gen.ts must match the committed openapi.json; contract.ts then type-checks against it.
      - name: Generated API types up to date
        run: npm run gen:api && git diff --exit-code -- src/api/schema.gen.ts

      - name: Typecheck + build
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:coverage

      # shortcut: node only reports files a test imports, so a never-imported file (every .tsx
      # page today) is not gated; revisit once components get render tests.
      - name: Diff coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          sed 's|^SF:|SF:frontend/|' frontend/lcov.info > lcov.info
          pipx run --spec 'diff-cover>=10.0,<11.0' diff-cover lcov.info --compare-branch=origin/${{ github.base_ref }} --fail-under=80

  # Browser flow tests against the slim app stack (API + built frontend + Postgres, demo data).
  # The holdout acceptance tests and the evaluator agent reuse the same stack.
  e2e:
    name: E2E (browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/arp_neo4j_test
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p arp_neo4j_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ARP_NEO4J_URI: bolt://localhost:7687
      ARP_NEO4J_PASSWORD: arp_neo4j_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend, frontend and Chromium
        run: |
          (cd backend && pip install -e ".[dev,postgres,opensearch,emerging_themes,object_storage]")
          . .github/scripts/private_nltk_data.sh
          (cd frontend && npm ci)
          python -m playwright install --with-deps chromium

      - name: Start the app stack
        run: bash backend/scripts/e2e_stack.sh up

      - name: Browser tests
        working-directory: backend
        env:
          ARP_E2E_URL: http://localhost:5173
        run: pytest -q -m e2e tests/e2e

      - name: Stack logs on failure
        if: failure()
        run: tail -n 50 "${TMPDIR:-/tmp}"/arp-e2e/*.log

  # Optional live Superset suite (backend/tests/test_bi_live_superset.py), left
  # off: it needs a running, bootstrapped Superset (docker compose --env-file
  # backend/.env up -d postgres superset; arp bi bootstrap), not available on a
  # plain runner. It reads ARP_TEST_SUPERSET_URL, ARP_POSTGRES_DSN (a DB with
  # `arp db init-postgres` and the demo seed), ARP_SUPERSET_PASSWORD and
  # ARP_BI_READER_PASSWORD (plus ARP_BI_SUPERSET_DB_HOST if Superset reaches
  # Postgres elsewhere than postgres:5432). On a machine with Docker:
  #   cd backend && ARP_TEST_SUPERSET_URL=http://127.0.0.1:8088 ARP_POSTGRES_DSN=... \
  #     ARP_SUPERSET_PASSWORD=... ARP_BI_READER_PASSWORD=... pytest -m live_superset
  # Without ARP_TEST_SUPERSET_URL the suite skips, so the normal pytest job is unaffected.

  # --- Corporate Readiness Plan, Phase 0 (docs/CORPORATE_READINESS_PLAN.md) ---

  retrieval-scope:
    name: Retrieval recall scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- backend/arp/retrieval backend/arp/ingestion \
            backend/arp/planning/doc_routing.py backend/arp/extraction/field_graph.py backend/arp/presets \
            backend/tests/golden/retrieval)
          if [ -n "$changed" ]; then echo "run=true" >>"$GITHUB_OUTPUT"; else echo "run=false" >>"$GITHUB_OUTPUT"; fi

  # Recall of the committed retrieval gold set (spec retrieval-gold-set-and-question-queries). Default settings
  # (hybrid on, rerank off), no model calls, no API key. The floor is main's recall@12 when this shipped minus
  # 0.02 (main 0.588 with hybrid on); raise it by hand when retrieval gets better.
  retrieval-recall:
    name: Retrieval recall
    needs: retrieval-scope
    if: needs.retrieval-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:  # the arp CLI needs its system of record; hybrid retrieval caches embeddings there
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ARP_POSTGRES_DSN: postgresql+psycopg://arp:arp@localhost:5432/arp_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package
        run: pip install -e ".[postgres]"

      - name: Private NLTK data (nltk >= 3.10.4 refuses shared dirs)
        run: . "$GITHUB_WORKSPACE/.github/scripts/private_nltk_data.sh"

      - name: Cache gold-set PDFs and models
        uses: actions/cache@v4
        with:
          path: |
            backend/tests/golden/retrieval/documents
            ~/.cache/huggingface
          key: retrieval-recall-${{ hashFiles('backend/tests/golden/retrieval/documents.json') }}

      - name: Run the retrieval gold set
        run: |
          set -o pipefail
          arp db init-postgres
          arp golden-set retrieval --cases tests/golden/retrieval/cases.json --min-recall 0.568 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-supply-chain:
    name: Backend dependency audit + SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package
        run: pip install -e ".[postgres,opensearch,object_storage,emerging_themes]"

      # Non-blocking for now: flips to a required check once the existing
      # dependency set has been triaged (see CORPORATE_READINESS_PLAN.md
      # Phase 0) rather than breaking CI on day one over pre-existing,
      # possibly-unactionable transitive CVEs.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom-backend.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend/sbom-backend.json

  frontend-supply-chain:
    name: Frontend dependency audit + SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Non-blocking for now -- see backend-supply-chain above.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom-frontend.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.json

  # --- Corporate Readiness Plan, Phase 1 ---

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t arp-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t arp-frontend:ci frontend

      # Non-blocking for now -- see backend-supply-chain above.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: arp-backend:ci
          severity: "CRITICAL,HIGH"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: arp-frontend:ci
          severity: "CRITICAL,HIGH"
