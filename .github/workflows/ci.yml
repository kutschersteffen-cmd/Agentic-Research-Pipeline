name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package (dev extras)
        run: pip install -e ".[dev,postgres,emerging_themes]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

  # --- Corporate Readiness Plan, Phase 0 (docs/CORPORATE_READINESS_PLAN.md) ---

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-supply-chain:
    name: Backend dependency audit + SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package
        run: pip install -e ".[postgres,emerging_themes]"

      # Non-blocking for now: flips to a required check once the existing
      # dependency set has been triaged (see CORPORATE_READINESS_PLAN.md
      # Phase 0) rather than breaking CI on day one over pre-existing,
      # possibly-unactionable transitive CVEs.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom-backend.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend/sbom-backend.json

  frontend-supply-chain:
    name: Frontend dependency audit + SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Non-blocking for now -- see backend-supply-chain above.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom-frontend.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: frontend/sbom-frontend.json

  # --- Corporate Readiness Plan, Phase 1 ---

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t arp-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t arp-frontend:ci frontend

      # Non-blocking for now -- see backend-supply-chain above.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          image-ref: arp-backend:ci
          severity: "CRITICAL,HIGH"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          image-ref: arp-frontend:ci
          severity: "CRITICAL,HIGH"
