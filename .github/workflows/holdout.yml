name: Holdout acceptance

# Runs the hidden acceptance tests (private repo kutschersteffen-cmd/holdout) against this PR's build
# (spec docs/superpowers/specs/2026-11-15-holdout-faster-runs-design.md).
# - A PR runs only its own rows: `Spec: <slug>` in the description runs that spec's rows (`run.py --spec <slug>
#   --no-regression`); a `Rows: AC-1, AC-4` line narrows them to one slice. A PR without `Spec:` runs no rows.
# - The full suite runs nightly and on manual runs, and on a PR whose description has a line that is exactly
#   `Holdout: full`: 6 jobs `Holdout shard K/6`, each `run.py --shard K/6`, all on the same holdout commit.
# - The job `Holdout acceptance` (the required check) is green only when every job this run needs is green
#   and, for a full run, the shards reported exactly the rows of `run.py --list`.
# - A failed nightly run, or a failed manual run on main, opens one issue; a green one closes the open ones.
# The holdout repo's run.py prints only result lines (`<folder> AC-n: pass|fail|skip`) and `<group>: done in N s`, so the
# implementing agent, which can read these logs, learns which row failed and never how it was checked. The tests
# are fetched after the app has started and deleted when the job ends; the only artifact is each shard's result
# lines. Needs the HOLDOUT_TOKEN secret (read-only access to the holdout repo); without it the run warns and passes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      drill_fail:
        description: "Drill: run no tests; Holdout shard 1/6 fails with 'drill AC-1: fail' and a 'Holdout drill failed' issue opens"
        type: boolean
        default: false

# One run per PR: a push cancels the run for the older commit. An edit (the Spec:/Rows:/Holdout: lines live in
# the PR body) queues behind a running run instead of cancelling it. Each manual run has its own group, so it
# never cancels and is never cancelled by another run.
concurrency:
  group: holdout-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id)) || 'nightly' }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  setup:
    name: Holdout setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      parts: ${{ steps.plan.outputs.parts }}
      shards: ${{ steps.plan.outputs.shards }}
      spec: ${{ steps.plan.outputs.spec }}
      rows: ${{ steps.plan.outputs.rows }}
      full: ${{ steps.plan.outputs.full }}
      drill: ${{ steps.plan.outputs.drill }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      # Skipped, still reporting success so a required check never stays pending:
      # - a title-only edit when this commit already has a successful run (a failed or cancelled one reruns);
      # - PRs that change no app code: every file under docs/ or .claude/, or a *.md anywhere;
      # - no HOLDOUT_TOKEN.
      # Otherwise it picks the test jobs (`parts`) and the holdout commit every job checks out.
      - name: Plan the run
        id: plan
        env:
          SHARDS: 6
          KEY: ${{ secrets.HOLDOUT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.drill_fail }}
          TITLE_ONLY_EDIT: ${{ github.event.action == 'edited' && github.event.changes.body == null }}
        run: |
          skip() { echo "enabled=false" >>"$GITHUB_OUTPUT"; echo "$1"; exit 0; }
          if [ "$EVENT" = pull_request ]; then
            if [ "$TITLE_ONLY_EDIT" = true ] && [ "$(gh run list --workflow holdout.yml --commit "$HEAD_SHA" --status success --json databaseId --jq length)" -gt 0 ]; then
              skip "Holdout acceptance skipped: the edit did not change the PR body and this commit already passed."
            fi
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
            code=$(printf '%s\n' "$files" | awk 'NF && !/^docs\// && !/^\.claude\// && !/\.md$/' | wc -l)
            if [ -n "$files" ] && [ "$code" -eq 0 ]; then
              skip "Holdout acceptance skipped: no app code changed (every changed file is under docs/ or .claude/, or is a *.md)."
            fi
          fi
          if [ -z "$KEY" ]; then
            echo "::warning title=Hidden tests not run::Add the HOLDOUT_TOKEN repository secret (read-only access to kutschersteffen-cmd/holdout)."
            skip "Holdout acceptance skipped: no HOLDOUT_TOKEN."
          fi

          spec="" rows="" full=true
          if [ "$EVENT" = pull_request ]; then
            spec=$(printf '%s\n' "$PR_BODY" | sed -n 's/^Spec: *\([A-Za-z0-9_.-]*\).*/\1/p' | head -1)
            if [ -n "$spec" ]; then rows=$(printf '%s\n' "$PR_BODY" | sed -n 's/^Rows: *\([AC0-9, -]*\).*/\1/p' | head -1 | tr -d ' '); fi
            # The opt-in is a line that is exactly `Holdout: full` (trailing whitespace, including \r, allowed).
            if printf '%s\n' "$PR_BODY" | grep -qE '^Holdout: full[[:space:]]*$'; then full=true; else full=false; fi
          fi
          parts=()
          if [ -n "$spec" ]; then parts+=(own); fi
          if [ "$full" = true ]; then for k in $(seq 1 "$SHARDS"); do parts+=("$k/$SHARDS"); done; fi
          {
            echo "enabled=true"
            echo "shards=$SHARDS"
            echo "spec=$spec"
            echo "rows=$rows"
            echo "full=$full"
            echo "drill=$DRILL"
            echo "parts=$(printf '%s\n' "${parts[@]}" | jq -Rnc '[inputs | select(length > 0)]')"
          } >>"$GITHUB_OUTPUT"
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Holdout acceptance: no Spec: line; hidden rows run nightly on main."
            exit 0
          fi
          commit=$(GH_TOKEN="$KEY" gh api repos/kutschersteffen-cmd/holdout/commits/HEAD --jq .sha)
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "holdout commit: $commit"

  # One job per part: `own` (this PR's own rows) and/or the shards `K/6` of the full suite.
  test:
    name: ${{ matrix.part == 'own' && 'Holdout own rows' || format('Holdout shard {0}', matrix.part) }}
    needs: setup
    if: needs.setup.outputs.enabled == 'true' && needs.setup.outputs.parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part == 'own' && 45 || matrix.part == '3/6' && 1 || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.setup.outputs.parts) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/arp_neo4j_test
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p arp_neo4j_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ARP_POSTGRES_DSN: postgresql+psycopg://arp:arp@localhost:5432/arp_test
      ARP_NEO4J_URI: bolt://localhost:7687
      ARP_NEO4J_USER: neo4j
      ARP_NEO4J_PASSWORD: arp_neo4j_test
      PART: ${{ matrix.part }}
      DRILL: ${{ needs.setup.outputs.drill }}
    steps:
      # Test stand-ins: web search, fetch and model answers come from fixture files the hidden tests write here.
      # Set from a step because the runner context is not available in job-level env.
      - name: Point the app at the stand-in folder
        run: |
          echo "ARP_STANDINS_DIR=$RUNNER_TEMP/standins" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Drill (no tests)
        if: env.DRILL == 'true'
        run: |
          if [ "$PART" = 1/6 ]; then echo "drill AC-1: fail" | tee "$RUNNER_TEMP/results/out.txt"; exit 1; fi
          echo "Drill: no tests in this part."

      - uses: actions/checkout@v4
        if: env.DRILL != 'true'

      - uses: actions/setup-python@v5
        if: env.DRILL != 'true'
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        if: env.DRILL != 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install the app (this PR)
        id: install
        if: env.DRILL != 'true'
        run: |
          (cd backend && pip install -e ".[dev,postgres,opensearch,emerging_themes,object_storage]")
          (cd frontend && npm ci)
          echo "playwright=$(python -m playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      # The browser download only; its system packages still install below.
      - uses: actions/cache@v4
        if: env.DRILL != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.install.outputs.playwright }}

      - name: Start the app (this PR)
        if: env.DRILL != 'true'
        run: |
          . .github/scripts/private_nltk_data.sh
          python -m playwright install --with-deps chromium
          bash backend/scripts/e2e_stack.sh up

      - uses: actions/checkout@v4
        if: env.DRILL != 'true'
        with:
          repository: kutschersteffen-cmd/holdout
          ref: ${{ needs.setup.outputs.commit }}
          token: ${{ secrets.HOLDOUT_TOKEN }}
          path: .holdout

      - name: Run the hidden tests
        if: env.DRILL != 'true'
        shell: bash
        env:
          SPEC: ${{ needs.setup.outputs.spec }}
          ROWS: ${{ needs.setup.outputs.rows }}
        run: |
          set -o pipefail
          if [ "$PART" = own ]; then
            python .holdout/run.py --spec "$SPEC" ${ROWS:+--rows "$ROWS"} --count
            python .holdout/run.py --spec "$SPEC" ${ROWS:+--rows "$ROWS"} --no-regression
          else
            python .holdout/run.py --shard "$PART" | tee "$RUNNER_TEMP/out.txt"
          fi

      - name: Remove the hidden tests
        if: always()
        run: rm -rf .holdout

      # Only the shard line and the result lines travel to `Holdout acceptance`: nothing else of the hidden tests.
      - name: Keep the result lines
        if: always() && matrix.part != 'own' && env.DRILL != 'true'
        run: |
          grep -E '^holdout shard: [0-9]+/[0-9]+$|^[^ ]+ AC-[^ ]+: (pass|fail|skip)$' "$RUNNER_TEMP/out.txt" \
            >"$RUNNER_TEMP/results/out.txt" || true

      - uses: actions/upload-artifact@v4
        if: always() && matrix.part != 'own'
        with:
          name: holdout-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/results/out.txt
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    name: Holdout acceptance
    needs: [setup, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      SETUP: ${{ needs.setup.result }}
      TEST: ${{ needs.test.result }}
      ENABLED: ${{ needs.setup.outputs.enabled }}
      PARTS: ${{ needs.setup.outputs.parts }}
      SHARDS: ${{ needs.setup.outputs.shards }}
      FULL: ${{ needs.setup.outputs.full }}
      DRILL: ${{ needs.setup.outputs.drill }}
      COMMIT: ${{ needs.setup.outputs.commit }}
      # A full run on main (nightly or manual) opens or closes the failure issue.
      ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the jobs this run needs
        id: jobs
        run: |
          if [ "$SETUP" != success ]; then
            echo "Holdout acceptance: Holdout setup concluded $SETUP."
            echo "ok=false" >>"$GITHUB_OUTPUT"
            if [ "$ON_MAIN" = true ]; then echo "full=true" >>"$GITHUB_OUTPUT"; fi  # for the issue
            exit 0
          fi
          if [ "$ENABLED" != true ]; then echo "Holdout acceptance skipped (the reason is in Holdout setup)."; echo "ok=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          if [ "$PARTS" = "[]" ]; then echo "Holdout acceptance: no Spec: line; hidden rows run nightly on main."; echo "ok=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          echo "Test jobs ($PARTS): $TEST"
          if [ "$TEST" = success ]; then echo "ok=true" >>"$GITHUB_OUTPUT"; else echo "ok=false" >>"$GITHUB_OUTPUT"; fi
          if [ "$FULL" = true ]; then echo "full=true" >>"$GITHUB_OUTPUT"; fi
          if [ "$FULL" = true ] && [ "$DRILL" != true ]; then echo "complete=true" >>"$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.jobs.outputs.full == 'true'
        with:
          fetch-depth: ${{ env.ON_MAIN == 'true' && '0' || '1' }}
          filter: blob:none

      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && steps.jobs.outputs.full == 'true' }}
        with:
          pattern: holdout-results-*
          path: ${{ runner.temp }}/results

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.jobs.outputs.complete == 'true' }}
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      # run.py --list starts no app; the packages are there in case it imports them while collecting rows.
      - name: Install the test packages
        if: ${{ !cancelled() && steps.jobs.outputs.complete == 'true' }}
        run: (cd backend && pip install -e ".[dev,postgres,opensearch,emerging_themes,object_storage]")

      - uses: actions/checkout@v4
        if: ${{ !cancelled() && steps.jobs.outputs.complete == 'true' }}
        with:
          repository: kutschersteffen-cmd/holdout
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.HOLDOUT_TOKEN }}
          path: .holdout

      - name: Check every row ran exactly once
        id: complete
        if: ${{ !cancelled() && steps.jobs.outputs.complete == 'true' }}
        shell: bash
        run: |
          echo "holdout commit: $COMMIT"
          python .holdout/run.py --list >"$RUNNER_TEMP/list.txt"
          rm -rf .holdout
          find "$RUNNER_TEMP/results" -name out.txt -print0 | sort -z >"$RUNNER_TEMP/files"
          if xargs -0 -a "$RUNNER_TEMP/files" python3 .github/scripts/holdout_complete.py "$SHARDS" "$RUNNER_TEMP/list.txt" |
            tee "$RUNNER_TEMP/complete.txt"; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "ok=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Remove the hidden tests
        if: always()
        run: rm -rf .holdout

      - name: Open an issue when a full run on main fails
        if: >-
          ${{ !cancelled() && env.ON_MAIN == 'true' && env.ENABLED != 'false' && (steps.jobs.outputs.ok != 'true' ||
          (steps.jobs.outputs.complete == 'true' && steps.complete.outputs.ok != 'true')) }}
        env:
          COMPLETE_OK: ${{ steps.complete.outputs.ok }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name != "Holdout acceptance") | "\(.conclusion)\t\(.name)"' >"$RUNNER_TEMP/jobs.txt"
          cat "$RUNNER_TEMP/jobs.txt"
          # Failed or timed out → issue. Only cancellations (e.g. cancelled by hand) → none, even with rows missing.
          if ! grep -qE '^(failure|timed_out)'$'\t' "$RUNNER_TEMP/jobs.txt"; then
            if grep -qE '^cancelled'$'\t' "$RUNNER_TEMP/jobs.txt" || [ "$COMPLETE_OK" = true ]; then
              echo "No issue: no job failed or timed out."
              exit 0
            fi
          fi

          since=$(date -u -d '30 days ago' +%F)
          last=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/holdout.yml/runs" -f event=schedule -f branch=main \
            -f status=success -f created=">=$since" -f per_page=1 --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$last" ]; then
            merges="main commits since the last green nightly: ${last:0:7}..${GITHUB_SHA:0:7}"
            range=("$last..$GITHUB_SHA")
          else
            merges="no green nightly in 30 days; the last 30 merges:"
            range=(-30 "$GITHUB_SHA")
          fi
          {
            echo "Run: $RUN_URL"
            echo "holdout commit: $COMMIT"
            echo
            echo "Failed result lines:"
            echo '```'
            find "$RUNNER_TEMP/results" -name out.txt -exec cat {} + 2>/dev/null | grep -E '^[^ ]+ AC-[^ ]+: fail$' || true
            echo '```'
            echo
            echo "Completeness:"
            echo '```'
            cat "$RUNNER_TEMP/complete.txt" 2>/dev/null || echo "not checked"
            echo '```'
            echo
            echo "Jobs that did not succeed:"
            awk -F'\t' '$1 != "success" && $1 != "skipped" { print "- " $2 ": " $1 }' "$RUNNER_TEMP/jobs.txt"
            echo
            echo "$merges"
            for c in $(git rev-list --first-parent "${range[@]}"); do
              s=$(git log -1 --format=%s "$c")
              if [[ $s =~ ^Merge\ pull\ request\ (#[0-9]+) ]]; then
                s="${BASH_REMATCH[1]} $(git log -1 --format=%b "$c" | sed '/^[[:space:]]*$/d' | head -1)"
              fi
              echo "- ${c:0:7} $s"
            done
          } >"$RUNNER_TEMP/issue.md"
          if [ "$DRILL" = true ]; then title="Holdout drill failed"; else title="Nightly Holdout failed"; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title $(date -u +%F)" --body-file "$RUNNER_TEMP/issue.md"

      - name: Close the failure issues after a green full run on main
        if: >-
          ${{ !cancelled() && env.ON_MAIN == 'true' && steps.jobs.outputs.complete == 'true' && steps.jobs.outputs.ok == 'true' &&
          steps.complete.outputs.ok == 'true' }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq '.[] | select(.title | startswith("Nightly Holdout failed")) | .number' |
            while read -r n; do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Closed: a full Holdout run on main is green: $RUN_URL"
            done

      - name: Verdict
        if: always()
        env:
          JOBS_OK: ${{ steps.jobs.outputs.ok }}
          NEEDS_COMPLETE: ${{ steps.jobs.outputs.complete }}
          COMPLETE_OK: ${{ steps.complete.outputs.ok }}
        run: |
          if [ "$JOBS_OK" != true ]; then echo "Holdout acceptance: a job this run needs did not succeed."; exit 1; fi
          if [ "$NEEDS_COMPLETE" = true ] && [ "$COMPLETE_OK" != true ]; then echo "Holdout acceptance: the shards did not run exactly the full suite."; exit 1; fi
          echo "Holdout acceptance: green."
