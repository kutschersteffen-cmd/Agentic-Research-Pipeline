name: Golden set

# AI output varies from run to run, so unit tests replace the model with a stand-in. This check runs
# the real extractor -> verifier -> grounding pipeline on the bundled golden set (manually verified
# extractions) whenever a PR touches extraction prompts, the LLM clients, grounding or the model
# settings, and fails if any case fails. PRs touching transition-barrier extraction, fetching, the rule book
# or its data also run the transition-barrier golden set; PRs touching backend/arp/rfp/ also run the RFP golden
# checks (question detection, drafting). It calls the real model, so it needs the
# ARP_ANTHROPIC_API_KEY repository secret; without it the job warns and passes.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/arp/extraction/**"
      - "backend/arp/llm/**"
      - "backend/arp/golden_set/**"
      - "backend/arp/grounding.py"
      - "backend/arp/config.py"
      - "backend/arp/transition_barrier/extraction.py"
      - "backend/arp/transition_barrier/golden.py"
      - "backend/arp/transition_barrier/fetching.py"
      - "backend/arp/transition_barrier/rule_book.py"
      - "backend/arp/transition_barrier/data/**"
      - "backend/tests/golden/transition_barrier/**"
      - "backend/arp/rfp/**"
      - "backend/arp/research/authority_taxonomy/**"
      - "backend/tests/golden/authority_taxonomy/**"
      - "backend/arp/research/taxonomy_schema.py"
      - "backend/tests/golden/stage_evidence/**"
  workflow_dispatch:

jobs:
  golden-set:
    name: Golden set (real model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:  # the arp CLI needs its system of record even for the golden set
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ARP_POSTGRES_DSN: postgresql+psycopg://arp:arp@localhost:5432/arp_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # config.py changes often for other reasons; only its model settings matter here.
      - name: Decide whether the change touches the model path
        id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then echo "run=true" >>"$GITHUB_OUTPUT"; echo "rfp=true" >>"$GITHUB_OUTPUT"; echo "gate=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          rfp=$(git diff --name-only "origin/$BASE...HEAD" -- arp/rfp)
          if [ -n "$rfp" ]; then echo "rfp=true" >>"$GITHUB_OUTPUT"; else echo "rfp=false" >>"$GITHUB_OUTPUT"; fi
          gate=$(git diff --name-only "origin/$BASE...HEAD" -- arp/extraction/evidence_gate.py)
          if [ -n "$gate" ]; then echo "gate=true" >>"$GITHUB_OUTPUT"; else echo "gate=false" >>"$GITHUB_OUTPUT"; fi
          other=$(git diff --name-only "origin/$BASE...HEAD" -- arp/extraction arp/llm arp/golden_set arp/grounding.py arp/transition_barrier/extraction.py arp/transition_barrier/golden.py arp/transition_barrier/fetching.py arp/transition_barrier/rule_book.py arp/transition_barrier/data tests/golden/transition_barrier arp/rfp arp/research/authority_taxonomy tests/golden/authority_taxonomy arp/research/taxonomy_schema.py tests/golden/stage_evidence)
          model=$(git diff -U0 "origin/$BASE...HEAD" -- arp/config.py | grep -E '^[+-] .*(llm_|_api_key|grounding_|confidence_review)' || true)
          if [ -n "$other$model" ]; then echo "run=true" >>"$GITHUB_OUTPUT"; else echo "run=false" >>"$GITHUB_OUTPUT"; echo "Only unrelated config.py lines changed; golden set not needed."; fi

      - name: Check for the API key
        id: key
        if: steps.scope.outputs.run == 'true'
        env:
          KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >>"$GITHUB_OUTPUT"; else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::warning title=Golden set not run::Add the ARP_ANTHROPIC_API_KEY repository secret so AI changes are checked against the golden set."
          fi

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package
        if: steps.key.outputs.present == 'true'
        run: pip install -e ".[postgres]"

      - name: Private NLTK data (nltk >= 3.10.4 refuses shared dirs)
        if: steps.key.outputs.present == 'true'
        run: . "$GITHUB_WORKSPACE/.github/scripts/private_nltk_data.sh"

      - name: Run the golden set
        if: steps.key.outputs.present == 'true'
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          arp db init-postgres
          arp golden-set run | tee -a "$GITHUB_STEP_SUMMARY"
          arp golden-set run --long | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare the golden set with the evidence gate on and off
        # evidence-gate spec AC-31, AC-32: both pass. Tokens are printed, not gated: the golden cases are too short
        # for the gate to drop anything (AC-33 retired; owner decision 2026-11-02)
        if: steps.key.outputs.present == 'true' && steps.scope.outputs.gate == 'true'
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          arp golden-set run --gate off | tee off.txt | tee -a "$GITHUB_STEP_SUMMARY"
          arp golden-set run --gate on | tee on.txt | tee -a "$GITHUB_STEP_SUMMARY"
          off=$(tail -1 off.txt | grep -oE '[0-9]+$'); on=$(tail -1 on.txt | grep -oE '[0-9]+$')
          echo "extractor input tokens: gate off $off, gate on $on" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare the long golden set with the evidence gate on and off
        # long-document golden cases spec AC-14 to AC-16: both pass, and the gate cuts extractor input by at least 10%
        if: steps.key.outputs.present == 'true' && steps.scope.outputs.gate == 'true'
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          arp golden-set run --long --gate off | tee long_off.txt | tee -a "$GITHUB_STEP_SUMMARY"
          arp golden-set run --long --gate on | tee long_on.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/compare_gate_tokens.py long_off.txt long_on.txt --max-ratio 0.9 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the transition-barrier golden set
        # warn-only until the owner has checked the labels (tests/golden/transition_barrier/LABELS.md, D2)
        if: steps.key.outputs.present == 'true'
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          arp transition-barrier golden --cases tests/golden/transition_barrier/cases.json --documents-dir tests/golden/transition_barrier/documents --min-precision 0.95 --min-coverage 0.5 | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "::warning title=Transition-barrier golden below threshold::Below precision 0.95 or coverage 0.5; warn-only until the labels are checked (LABELS.md D2)."

      - name: Run the RFP golden checks
        if: steps.key.outputs.present == 'true' && steps.scope.outputs.rfp == 'true'
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          arp rfp golden questions --cases arp/golden_set/data/rfp_questions.json --min-recall 0.95 | tee -a "$GITHUB_STEP_SUMMARY"
          arp rfp golden drafts --cases arp/golden_set/data/rfp_drafts.json --min-drafted 0.90 --min-blank 0.95 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the authority-taxonomy golden case
        # runs even when an earlier golden step failed, so its own result is always reported
        if: ${{ !cancelled() && steps.key.outputs.present == 'true' }}
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          arp golden-set authority-taxonomy --case hydrogen_eu_taxonomy | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the stage-evidence golden cases
        if: ${{ !cancelled() && steps.key.outputs.present == 'true' }}
        env:
          ARP_ANTHROPIC_API_KEY: ${{ secrets.ARP_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          arp golden-set precision --schema-file tests/golden/stage_evidence/schema.json --cases tests/golden/stage_evidence/cases.json --documents-dir tests/golden/stage_evidence/documents --min-precision 0.9 | tee -a "$GITHUB_STEP_SUMMARY"
