<style>
*{box-sizing:border-box;margin:0;border-radius:0}
body{background:#000;color:#c6ff3d;font:700 15px/1 "Geist Mono",monospace;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.t{display:flex;justify-content:space-between;padding:12px 20px;border-bottom:6px solid #c6ff3d;text-transform:uppercase;font-size:13px}

.row div:last-child{border:0;background:#ea4c14;color:#000}
