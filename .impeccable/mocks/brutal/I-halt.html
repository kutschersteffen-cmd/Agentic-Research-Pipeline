<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Halt</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;800;900&family=Geist+Mono:wght@500;700&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box;margin:0;border-radius:0}
body{background:#ea4c14;color:#000;font:700 15px/1.1 Geist,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.bar{display:flex;justify-content:space-between;padding:12px 20px;background:#000;color:#ea4c14;font:700 13px "Geist Mono",monospace;text-transform:uppercase}
.big{flex:1;position:relative;padding:0 20px;display:flex;flex-direction:column;justify-content:center}
.big b{font:900 min(46vw,640px)/.74 Geist,Helvetica;letter-spacing:-.1em;margin-left:-.04em}
.big h1{margin-top:2vw;font:900 clamp(2.4rem,7vw,7rem)/.88 Geist;letter-spacing:-.055em;text-transform:uppercase;max-width:14ch}
.big h1 s{text-decoration:none;background:#000;color:#ea4c14;padding:0 .12em}
.list{border-top:8px solid #000;display:grid;grid-template-columns:repeat(3,1fr)}
.list a{padding:14px 20px 18px;border-right:8px solid #000;font:900 clamp(1.4rem,3vw,2.8rem)/.95 Geist;letter-spacing:-.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:flex-end;min-height:130px;color:#000;text-decoration:none}
.list a:last-child{border:0}.list a span{font:700 13px "Geist Mono"}
.list a:hover{background:#000;color:#ea4c14}
.stripe{height:36px;background:repeating-linear-gradient(-45deg,#000 0 22px,#ea4c14 22px 44px)}
@media(max-width:760px){.list{grid-template-columns:1fr}.list a{border-right:0;border-bottom:8px solid #000;min-height:90px}}
</style>
<div class=bar><span>ARP · stop</span><span>12 votes · 1 failed run</span><span>Nothing ships</span></div>
<div class=big><b id=n>13</b><h1>Stop. <s>13</s> items need a human.</h1></div>
<div class=stripe></div>
