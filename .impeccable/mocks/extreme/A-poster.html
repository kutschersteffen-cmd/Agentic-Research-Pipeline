<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;800&family=Geist+Mono:wght@500&display=swap" rel=stylesheet>
<style>
:root{--lime:#c6ff3d;--k:#000}
*{box-sizing:border-box;margin:0}
body{background:var(--lime);color:var(--k);font:600 15px/1.2 Geist,Helvetica,Arial,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:6px solid var(--k);font:500 13px "Geist Mono",monospace;text-transform:uppercase}
.hero{position:relative;border-bottom:6px solid var(--k);height:min(78vh,760px);overflow:hidden}
.n{position:absolute;left:-1vw;bottom:-6vw;font:800 min(58vw,820px)/.78 Geist,Helvetica,Arial,sans-serif;letter-spacing:-.09em}
.cap{position:absolute;right:20px;top:20px;width:min(34ch,40vw);font:800 clamp(1.6rem,3.2vw,3.2rem)/.95 Geist,Helvetica;letter-spacing:-.04em;text-align:right}
.cap s{background:var(--k);color:var(--lime);text-decoration:none;padding:0 .15em}
.grid{display:grid;grid-template-columns:repeat(4,1fr)}
.c{padding:16px 20px 22px;border-right:6px solid var(--k);min-height:230px;display:flex;flex-direction:column;transition:.15s}
.c:last-child{border:0}
.c:hover{background:var(--k);color:var(--lime)}
.c .k{font:500 13px "Geist Mono"}
.c b{font:800 clamp(4rem,9vw,9rem)/.85 Geist;letter-spacing:-.07em;margin-top:auto}
.c h2{font:800 1.5rem Geist;letter-spacing:-.03em;margin-top:8px}.c p{font-weight:600;font-size:13px;margin-top:4px;max-width:30ch}
.tick{background:var(--k);color:var(--lime);border-top:6px solid var(--k);overflow:hidden;white-space:nowrap;font:500 14px "Geist Mono";padding:10px 0}
.tick span{display:inline-block;animation:t 22s linear infinite}
@keyframes t{to{transform:translateX(-50%)}}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.c{border-bottom:6px solid var(--k)}.cap{font-size:1.3rem}}
@media(prefers-reduced-motion:reduce){.tick span{animation:none}}
</style>
<div class=top><span>ARP / Start</span><span>02.10.2026</span><span>Agents propose · You ratify</span></div>
<div class=hero><div class=n>15</div><div class=cap>decisions wait on <s>you</s>. nothing ships until you say so.</div></div>
<div class=grid id=g></div>
<div class=tick><span id=t></span></div>
<script src=../directions/shared.js></script><script>
g.innerHTML=PROCS.map(p=>`<div class=c><span class=k>${p.k} →</span><b>${p.w||'0'}</b><h2>${p.n}</h2><p>${p.p}</p></div>`).join('')
const s='EVERY CITATION RE-VERIFIED ■ THE LLM PLANS, CODE COMPUTES ■ AGENTS PROPOSE, PEOPLE RATIFY ■ 4,000 COMPANIES PER RUN ■ ';t.textContent=s.repeat(6)
</script>
